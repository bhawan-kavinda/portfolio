<html lang="si">
<head>
<meta charset="utf-8">

<title>Portfolio Village 2D (demo)</title>
<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1d1c;--ink:#ece6d6;--card:#262927;--line:#444941;--accent:#6fc2c9;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1d1c;--ink:#ece6d6;--card:#262927;--line:#444941;--accent:#6fc2c9;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Trebuchet MS",system-ui,sans-serif;min-height:100vh}
main{max-width:760px;margin:0 auto;padding:14px}

h1{font:700 1.25rem/1.2 Georgia,serif;margin:0}
button{font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stage{position:relative;border:3px solid var(--ink);border-radius:6px;overflow:hidden;touch-action:none;aspect-ratio:4/3;background:#79a863}
@media (max-width:600px){.stage{aspect-ratio:1/1}}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;left:8px;top:8px;background:rgba(255,250,240,.9);color:#23201b;border-radius:6px;padding:4px 10px;font-size:.85rem}
#jbtn{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:var(--card);color:var(--ink);border:2px solid var(--accent);font-weight:700;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.35)}
#wheel{position:absolute;left:10px;bottom:10px;z-index:2;touch-action:none;cursor:grab;filter:drop-shadow(0 2px 4px rgba(0,0,0,.45))}
#wheel svg{display:block}
#hint{margin:8px 2px;font-size:.9rem;opacity:.8}
.pad{display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(2,60px);gap:6px;justify-content:center;margin:12px 0}
.pad button{padding:0;font-size:1.3rem;user-select:none;-webkit-user-select:none;touch-action:none}
.pad .u{grid-column:2}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
#panel,#start{position:absolute;inset:0;background:rgba(20,20,18,.55);display:none;align-items:center;justify-content:center;padding:14px}
#panel.on,#start.on{display:flex}.hb{display:flex;gap:8px}
.card{background:var(--card);border:2px solid var(--ink);border-radius:8px;padding:16px;max-width:380px;width:100%;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
h2{font:700 1.15rem Georgia,serif;margin:0 0 6px}
p{margin:0 0 10px}ul{margin:0 0 12px;padding-left:18px}
#plain{display:none}
#plain section{background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:14px;margin-bottom:10px}
body.plain #game{display:none}body.plain #plain{display:block}
</style>
</head>
