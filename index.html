<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio Village 2D (demo)</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<header>
<h1>Nimal's Village 2D <small style="font-weight:400;opacity:.7">(demo)</small></h1>
<div class="hb"><button id="fsb" type="button" aria-label="Full screen">⛶</button><button id="snd" type="button">Sound: on</button><button id="toggle" type="button">Skip game</button></div>
</header>
<div id="game">
<div class="stage">
<canvas id="c" aria-label="Walkable 2D portfolio village"></canvas>
<div id="hud"></div>
<button id="vbtn" type="button" hidden>👁 View</button>
<button id="jbtn" type="button" hidden></button>
<div id="wheel" hidden aria-label="Steering wheel"><img src="wheel.svg" width="84" height="84" alt="" draggable="false"></div>
<div id="panel" role="dialog" aria-modal="true"><div class="card" id="card"></div></div>
<div id="start" class="on"><div class="card"><h2>ගමට සාදරයෙන් පිළිගනිමු</h2><p>Walk the path, collect every coin and visit all three houses.</p><button type="button" id="go">Start</button></div></div>
</div>
<p id="hint">Arrow keys / WASD හෝ බොත්තම්. ජීප් එක ළඟට ගොස් 🚙 ඔබන්න (E). ජීප් එකේදී (රියදුරු view): ▲ ඉදිරියට, ▼ තිරිංගය/පසුපසට, ◀ ▶.</p>
<div class="pad" aria-label="Controls">
<button class="u" data-k="up" aria-label="Up">▲</button>
<button class="l" data-k="left" aria-label="Left">◀</button>
<button class="d" data-k="down" aria-label="Down">▼</button>
<button class="r" data-k="right" aria-label="Right">▶</button>
</div>
</div>
<div id="plain"></div>
</main>
<script src="game.js"></script>
</body>
</html>
