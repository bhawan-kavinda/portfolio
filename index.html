<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Village Walk - 16-bit Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>VILLAGE WALK &middot; 16-BIT DEMO</h1>
<div id="w"><canvas id="c" width="320" height="240"></canvas>
<div id="bn" hidden></div><div id="hud"><span id="hudhp"></span><span id="hudtm"></span></div><div id="go" hidden><b>GAME OVER</b><span id="got"></span><span>Press A to retry</span></div><div id="dlg" hidden><b id="nm"></b><span id="tx"></span><i><img src="svg/dialog-arrow.svg" width="10" height="10" alt=""></i></div></div>
<div id="pad">
<div id="dp">
<span></span><button data-k="up" aria-label="Up"><img src="svg/arrow.svg" alt=""></button><span></span>
<button data-k="left" aria-label="Left"><img style="transform:rotate(-90deg)" src="svg/arrow.svg" alt=""></button><span></span><button data-k="right" aria-label="Right"><img style="transform:rotate(90deg)" src="svg/arrow.svg" alt=""></button>
<span></span><button data-k="down" aria-label="Down"><img style="transform:rotate(180deg)" src="svg/arrow.svg" alt=""></button><span></span>
</div>
<small>Arrows / WASD to move<br>Space = Talk<br>AUTO = go to next place</small>
<button id="au">AUTO</button>
<button id="a">A</button>
</div>
<script src="script.js"></script>
</body>
</html>
