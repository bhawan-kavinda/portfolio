<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Village Walk - 16-bit Demo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14101c"/>
      <stop offset="1" stop-color="#3a2866"/>
    </linearGradient>
    <style>
      .t{font-family:"Courier New",ui-monospace,monospace;font-weight:700}
      .tw{animation:tw 2s steps(2) infinite}
      .tw2{animation:tw 2s steps(2) infinite 1s}
      .bl{animation:bl .8s steps(2) infinite}
      @keyframes tw{50%{opacity:.15}}
      @keyframes bl{50%{transform:translateY(4px)}}
    </style>
  </defs>

  <rect width="900" height="260" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#fff" shape-rendering="crispEdges">
    <rect class="tw" x="60" y="30" width="4" height="4"/>
    <rect class="tw2" x="150" y="70" width="4" height="4"/>
    <rect class="tw" x="260" y="24" width="4" height="4"/>
    <rect class="tw2" x="620" y="36" width="4" height="4"/>
    <rect class="tw" x="730" y="76" width="4" height="4"/>
    <rect class="tw2" x="840" y="28" width="4" height="4"/>
    <rect class="tw" x="470" y="18" width="4" height="4"/>
  </g>

  <!-- moon -->
  <g shape-rendering="crispEdges">
    <rect x="780" y="40" width="28" height="28" fill="#ffd84a"/>
    <rect x="772" y="48" width="44" height="12" fill="#ffd84a"/>
    <rect x="790" y="44" width="10" height="10" fill="#e8b92c"/>
  </g>

  <!-- ground -->
  <g shape-rendering="crispEdges">
    <rect x="0" y="206" width="900" height="54" fill="#2f6b3a"/>
    <rect x="0" y="206" width="900" height="6" fill="#4a9a52"/>
    <rect x="0" y="236" width="900" height="24" fill="#a98a52"/>
  </g>

  <!-- houses (left) -->
  <g shape-rendering="crispEdges">
    <rect x="40" y="150" width="72" height="56" fill="#efe6d0"/>
    <polygon points="32,150 76,114 120,150" fill="#c43a3a"/>
    <rect x="68" y="176" width="16" height="30" fill="#5b3f8c"/>
    <rect x="48" y="160" width="12" height="12" fill="#ffd84a"/>

    <rect x="140" y="164" width="56" height="42" fill="#efe6d0"/>
    <polygon points="132,164 168,134 204,164" fill="#5b3f8c"/>
    <rect x="160" y="184" width="14" height="22" fill="#2b2218"/>
  </g>

  <!-- houses (right) -->
  <g shape-rendering="crispEdges">
    <rect x="690" y="156" width="76" height="50" fill="#efe6d0"/>
    <polygon points="682,156 728,120 774,156" fill="#c43a3a"/>
    <rect x="720" y="178" width="16" height="28" fill="#5b3f8c"/>
    <rect x="700" y="166" width="12" height="12" fill="#ffd84a"/>
    <rect x="744" y="166" width="12" height="12" fill="#ffd84a"/>

    <rect x="796" y="168" width="64" height="38" fill="#efe6d0"/>
    <polygon points="788,168 828,140 868,168" fill="#2f8f4a"/>
    <rect x="820" y="184" width="14" height="22" fill="#2b2218"/>
  </g>

  <!-- trees -->
  <g shape-rendering="crispEdges">
    <rect x="222" y="178" width="8" height="28" fill="#6b4a24"/>
    <rect x="208" y="152" width="36" height="32" fill="#1f5a2c"/>
    <rect x="214" y="144" width="24" height="12" fill="#2f8f4a"/>
    <rect x="652" y="182" width="8" height="24" fill="#6b4a24"/>
    <rect x="640" y="158" width="32" height="30" fill="#1f5a2c"/>
    <rect x="646" y="150" width="20" height="12" fill="#2f8f4a"/>
  </g>

  <!-- title -->
  <g class="t" text-anchor="middle">
    <text x="454" y="124" font-size="64" fill="#000" letter-spacing="4">VILLAGE WALK</text>
    <text x="450" y="120" font-size="64" fill="#ffd84a" letter-spacing="4">VILLAGE WALK</text>
    <text x="450" y="150" font-size="16" fill="#efe6d0" letter-spacing="3">16-BIT DEMO &#183; PORTFOLIO PROJECT</text>
  </g>

  <!-- hearts -->
  <g shape-rendering="crispEdges" transform="translate(402,160) scale(4)">
    <path fill="#e83a3a" d="M1 0h2v1H1zM4 0h2v1H4zM0 1h7v2H0zM1 3h5v1H1zM2 4h3v1H2zM3 5h1v1H3z"/>
    <path transform="translate(9,0)" fill="#e83a3a" d="M1 0h2v1H1zM4 0h2v1H4zM0 1h7v2H0zM1 3h5v1H1zM2 4h3v1H2zM3 5h1v1H3z"/>
    <path transform="translate(18,0)" fill="#4a3a4a" d="M1 0h2v1H1zM4 0h2v1H4zM0 1h7v2H0zM1 3h5v1H1zM2 4h3v1H2zM3 5h1v1H3z"/>
  </g>

  <!-- player sprite -->
  <g shape-rendering="crispEdges">
    <rect x="436" y="212" width="16" height="6" fill="#000" opacity=".3"/>
    <rect x="438" y="190" width="12" height="10" fill="#f2c9a0"/>
    <rect x="438" y="186" width="12" height="5" fill="#2b2218"/>
    <rect x="436" y="200" width="16" height="10" fill="#5b3f8c"/>
    <rect x="438" y="210" width="5" height="4" fill="#2b2218"/>
    <rect x="445" y="210" width="5" height="4" fill="#2b2218"/>
  </g>
</svg>
